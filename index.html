<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <h1>Student Management System</h1>
      <div class="small">Simple full project with add / edit / delete / search / sort / import-export (localStorage)</div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <button class="btn" id="addStudentBtn">➕ Add Student</button>
      <div class="search">
        <input id="searchInput" class="input" placeholder="Search by name, roll, class, email..." />
        <select id="filterClass" class="select">
          <option value="">All Classes</option>
        </select>
        <select id="sortBy" class="select">
          <option value="name_asc">Name ↑</option>
          <option value="name_desc">Name ↓</option>
          <option value="roll_asc">Roll ↑</option>
          <option value="roll_desc">Roll ↓</option>
        </select>
      </div>
      <div class="right-actions">
        <button class="btn secondary" id="importBtn">Import CSV</button>
        <button class="btn secondary" id="exportBtn">Export CSV</button>
        <button class="btn secondary" id="clearAllBtn">Clear All</button>
      </div>
    </div>

    <div id="count" class="muted">No students yet</div>

    <table id="studentsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Roll</th>
          <th>Class</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <footer>Built with vanilla HTML/CSS/JS • Data stored in <code>localStorage</code></footer>
  </main>

  <!-- modal -->
  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Add Student</h3>
      <form id="studentForm">
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="name" class="input" required />
          </div>
          <div>
            <label>Roll</label>
            <input type="text" id="roll" class="input" required />
          </div>
          <div>
            <label>Class</label>
            <input type="text" id="classInput" class="input" required />
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="email" class="input" />
          </div>
          <div>
            <label>Phone</label>
            <input type="tel" id="phone" class="input" />
          </div>
          <div>
            <label>Notes</label>
            <input type="text" id="notes" class="input" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <input id="fileInput" type="file" accept=".csv" style="display:none" />

  <script src="app.js"></script>
</body>
</html>
